{%- assign responsive_sizes = "640,768,1024,1366,1600,1920,2048" | split: "," -%}
{%- assign pieces = include.content | split: '<img src="' -%}
{%- for piece in pieces -%}
	{%- if forloop.first -%}
		{{ piece }}
	{%- else -%}
		{%- assign tag_markup = piece | split: '>' | first -%}
		{%- assign after_img = piece | split: '>' | shift | join: '>' -%}
		{%- assign url = tag_markup | split: '"' | first -%}
		{%- assign attrs = tag_markup | split: '"' | shift | join: '"' -%}
		{%- assign alt = '' -%}
		{%- if attrs contains ' alt="' -%}
			{%- assign alt = attrs | split: ' alt="' | shift | join: ' alt="' | split: '"' | first -%}
		{%- endif -%}
		{%- assign extension = url | split: '.' | last | downcase -%}
		{%- if url contains site.pics_url and extension != 'gif' -%}
			{%- assign base_url = url | split: '.' | pop | join: '.' -%}
			{%- assign pathparts = base_url | split: '/' -%}
			{%- assign filename = pathparts | last -%}
			{%- assign path = pathparts | pop | join: '/' -%}
			<a href="{{ url }}" target="_blank">
			<img
				srcset="{%- for size in responsive_sizes -%}{{ path }}/{{ size }}/{{ filename }}-{{ size }}.{{ extension }} {{ size }}w{%- unless forloop.last -%},
					 {%- endunless -%}{%- endfor -%}"
				sizes="100vw"
				style="max-width:100%;"
				src="{{ url }}" alt="{{ alt }}" /></a>{{ after_img }}
		{%- else -%}
			<img src="{{ url }}"{{ attrs }}>{{ after_img }}
		{%- endif -%}
	{%- endif -%}
{%- endfor -%}
