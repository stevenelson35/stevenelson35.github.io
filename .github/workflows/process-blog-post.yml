name: Process Blog Post
on:
  repository_dispatch:
    types: [new-post]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger details
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Event action: ${{ github.event.action }}"
          echo "Client payload:"
          echo '${{ toJson(github.event.client_payload) }}'

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick optipng

      - name: Process & Update
        env:
          IMAGE_URL: ${{ github.event.client_payload.image_url }}
          IMAGE_STAGING_DIR: ${{ runner.temp }}/blog-image-uploads
          BLOG_FILENAME: ${{ github.event.client_payload.filename }}
          BLOG_POST_DATA: ${{ github.event.client_payload.post_data }}
        run: |
          set -e

          python3 - <<'PY' > /tmp/blog_env.sh
          import json
          import os
          import shlex

          payload = json.loads(os.environ.get('BLOG_POST_DATA', '{}') or '{}')
          mapping = {
              'IMAGE_ALT': payload.get('alt', ''),
              'BLOG_TITLE': payload.get('title', ''),
              'BLOG_AUTHOR': payload.get('author', ''),
              'BLOG_TOP_TEXT': payload.get('top_text', ''),
              'BLOG_BOTTOM_TEXT': payload.get('bottom_text', ''),
              'BLOG_QUOTE': payload.get('quote', ''),
              'BLOG_QUOTE_ATTRIBUTION': payload.get('quote_attribution', ''),
              'BLOG_YOUTUBE_ID': payload.get('youtube_id', ''),
              'BLOG_CATEGORIES': payload.get('categories', ''),
              'BLOG_TAGS': payload.get('tags', ''),
          }

          for key, value in mapping.items():
              print(f"{key}={shlex.quote(str(value))}")
          PY
          source /tmp/blog_env.sh

          mkdir -p all_collections/_posts/
          rm -rf "$IMAGE_STAGING_DIR"
          mkdir -p "$IMAGE_STAGING_DIR"

          format_yaml_list() {
            local input="$1"
            local items=()
            IFS=',' read -r -a items <<< "$input"
            local result=""
            for item in "${items[@]}"; do
              item="$(echo "$item" | xargs)"
              if [ -n "$item" ]; then
                if [ -n "$result" ]; then
                  result="${result}, "
                fi
                result="${result}\"${item}\""
              fi
            done
            echo "[$result]"
          }

          format_blockquote() {
            local input="$1"
            local line
            local lines=()
            while IFS= read -r line || [ -n "$line" ]; do
              lines+=("$line")
            done <<< "$input"

            if [ "${#lines[@]}" -eq 0 ]; then
              return
            fi

            printf '<blockquote>\n'
            for i in "${!lines[@]}"; do
              if [ -n "${lines[$i]}" ]; then
                printf '%s<br />\n' "${lines[$i]}"
              else
                printf '<br />\n'
              fi
            done
            printf '</blockquote>\n'
          }

          IMAGE_MARKDOWN=""
          if [ -n "$IMAGE_URL" ]; then
            IMAGE_NAME="$(basename "${IMAGE_URL%%\?*}")"
            IMAGE_PATH="$IMAGE_STAGING_DIR/$IMAGE_NAME"
            IMAGE_MARKDOWN="![${IMAGE_ALT}]({{ site.pics_url }}${IMAGE_NAME})"
          fi

          FILE_PATH="all_collections/_posts/${BLOG_FILENAME}"

          if [ -f "$FILE_PATH" ]; then
            {
              echo
              echo "$BLOG_TOP_TEXT"
              echo
              if [ -n "$IMAGE_MARKDOWN" ]; then
                echo "$IMAGE_MARKDOWN"
                echo
              fi
              if [ -n "$BLOG_YOUTUBE_ID" ]; then
                echo "{% include youtubePlayer.html id=\"${BLOG_YOUTUBE_ID}\" %}"
                echo
              fi
              echo "$BLOG_BOTTOM_TEXT"
              echo
            } >> "$FILE_PATH"

            if [ -n "$BLOG_QUOTE" ] || [ -n "$BLOG_QUOTE_ATTRIBUTION" ]; then
              printf '\n' >> "$FILE_PATH"
              if [ -n "$BLOG_QUOTE" ]; then
                format_blockquote "$BLOG_QUOTE" >> "$FILE_PATH"
                printf '\n' >> "$FILE_PATH"
              fi
              if [ -n "$BLOG_QUOTE_ATTRIBUTION" ]; then
                printf -- '- %s\n' "$BLOG_QUOTE_ATTRIBUTION" >> "$FILE_PATH"
              fi
            fi
          else
            {
              echo '---'
              echo "title: \"${BLOG_TITLE}\""
              echo "author: ${BLOG_AUTHOR}"
              if [ -n "$BLOG_CATEGORIES" ]; then
                echo "categories: $(format_yaml_list "$BLOG_CATEGORIES")"
              fi
              if [ -n "$BLOG_TAGS" ]; then
                echo "tags: $(format_yaml_list "$BLOG_TAGS")"
              fi
              if [ -n "$BLOG_YOUTUBE_ID" ]; then
                echo "youtubeId: ${BLOG_YOUTUBE_ID}"
              fi
              echo '---'
              echo
              echo "$BLOG_TOP_TEXT"
              echo
              if [ -n "$IMAGE_MARKDOWN" ]; then
                echo "$IMAGE_MARKDOWN"
                echo
              fi
              if [ -n "$BLOG_YOUTUBE_ID" ]; then
                echo "{% include youtubePlayer.html id=page.youtubeId %}"
                echo
              fi
              echo "$BLOG_BOTTOM_TEXT"
              echo
              if [ -n "$BLOG_QUOTE" ] || [ -n "$BLOG_QUOTE_ATTRIBUTION" ]; then
                if [ -n "$BLOG_QUOTE" ]; then
                  format_blockquote "$BLOG_QUOTE"
                fi
                if [ -n "$BLOG_QUOTE_ATTRIBUTION" ]; then
                  echo "- $BLOG_QUOTE_ATTRIBUTION"
                fi
              fi
            } > "$FILE_PATH"
          fi

          if [ -n "$IMAGE_URL" ]; then
            curl -L "$IMAGE_URL" -o "$IMAGE_PATH"
            if [ -f "scripts/create_responsive_images.py" ]; then
              python3 scripts/create_responsive_images.py "$IMAGE_PATH" --sizes 2048 1920 1600 1366 1024 768 640 --output-root "$IMAGE_STAGING_DIR"
            else
              python3 create_responsive_images.py "$IMAGE_PATH" --sizes 2048 1920 1600 1366 1024 768 640 --output-root "$IMAGE_STAGING_DIR"
            fi
          fi

      - name: Upload to Turbify via FTP
        if: ${{ github.event.client_payload.image_url != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ runner.temp }}/blog-image-uploads/
          server-dir: pics/blog/

      - name: Remove staged image files
        if: always()
        run: rm -rf "${{ runner.temp }}/blog-image-uploads"

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated blog update from phone"
          file_pattern: 'all_collections/_posts/*'
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }}

          
