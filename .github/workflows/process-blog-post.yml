name: Process Blog Post
on:
  repository_dispatch:
    types: [new-post]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger details
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Event action: ${{ github.event.action }}"
          echo "Client payload:"
          printf '%s\n' "$CLIENT_PAYLOAD"

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick optipng

      - name: Process & Update
        env:
          IMAGE_URL: ${{ github.event.client_payload.image_url }}
          IMAGE_STAGING_DIR: ${{ runner.temp }}/blog-image-uploads
          BLOG_FILENAME: ${{ github.event.client_payload.filename }}
          BLOG_POST_DATA: ${{ github.event.client_payload.post_data }}
        run: |
          set -e

          mkdir -p all_collections/_posts/
          rm -rf "$IMAGE_STAGING_DIR"
          mkdir -p "$IMAGE_STAGING_DIR"

          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path

          payload = json.loads(os.environ.get('BLOG_POST_DATA', '{}') or '{}')

          def clean_value(value, default=''):
              if value is None:
                  return default
              if isinstance(value, str):
                  value = value.strip()
              else:
                  value = str(value).strip()
              return value if value else default

          def format_yaml_list(items):
              values = [item.strip() for item in items.split(',') if item.strip()]
              if not values:
                  return '[]'
              return '[' + ', '.join(f'"{item}"' for item in values) + ']'

          def format_blockquote(text):
              lines = text.splitlines() or ['']
              output = []
              for line in lines:
                  if line:
                      output.append(f'> {line}  ')
                  else:
                      output.append('>  ')
                  # Keep a literal two-space separator line between quote lines
                  # so each line renders as its own blockquote in the final HTML.
                  output.append('  ')
              return '\n'.join(output)

          def process_image(image_url, image_name, staging_dir):
              image_path = os.path.join(staging_dir, image_name)
              if image_url:
                  urllib.request.urlretrieve(image_url, image_path)
              if os.path.exists('scripts/create_responsive_images.py'):
                  subprocess.run([
                      'python3', 'scripts/create_responsive_images.py', image_path,
                      '--sizes', '2048', '1920', '1600', '1366', '1024', '768', '640',
                      '--output-root', staging_dir
                  ], check=True)
              else:
                  subprocess.run([
                      'python3', 'create_responsive_images.py', image_path,
                      '--sizes', '2048', '1920', '1600', '1366', '1024', '768', '640',
                      '--output-root', staging_dir
                  ], check=True)
              return image_path

          clean_payload = {
              'title': clean_value(payload.get('title', ''), ''),
              'author': clean_value(payload.get('author', 'steve'), 'steve'),
              'top_text': clean_value(payload.get('top_text', ''), ''),
              'bottom_text': clean_value(payload.get('bottom_text', ''), ''),
              'quote': clean_value(payload.get('quote', ''), ''),
              'quote_attribution': clean_value(payload.get('quote_attribution', ''), ''),
              'youtube_id': clean_value(payload.get('youtube_id', ''), ''),
              'categories': clean_value(payload.get('categories', ''), ''),
              'tags': clean_value(payload.get('tags', ''), ''),
          }

          images = payload.get('images', [])
          if isinstance(images, list):
              cleaned_images = []
              for entry in images:
                  if not isinstance(entry, dict):
                      continue
                  image_url = clean_value(entry.get('image_url', ''), '')
                  text_before = clean_value(entry.get('text_before', ''), '')
                  alt_text = clean_value(entry.get('alt', ''), '')
                  file_name = clean_value(entry.get('file_name', ''), '')
                  if image_url or text_before or alt_text:
                      cleaned_images.append({
                          'text_before': text_before,
                          'image_url': image_url,
                          'alt': alt_text,
                          'file_name': file_name,
                      })
          else:
              cleaned_images = []

          if not cleaned_images and clean_value(os.environ.get('IMAGE_URL', ''), ''):
              cleaned_images.append({
                  'text_before': clean_payload['top_text'],
                  'image_url': clean_value(os.environ.get('IMAGE_URL', ''), ''),
                  'alt': clean_payload.get('alt', ''),
                  'file_name': '',
              })

          clean_payload['images'] = cleaned_images

          blog_filename = clean_value(os.environ.get('BLOG_FILENAME', ''), '')
          if not blog_filename:
              raise SystemExit('No blog filename provided')

          blog_filename = os.path.basename(blog_filename)
          file_path = os.path.join('all_collections/_posts', blog_filename)
          staging_dir = os.environ.get('IMAGE_STAGING_DIR', '')

          body_parts = []
          if clean_payload['top_text']:
              body_parts.append(clean_payload['top_text'])

          for index, image in enumerate(clean_payload['images'], start=1):
              if image.get('text_before'):
                  body_parts.append(image['text_before'])
              if image.get('image_url'):
                  image_name = image.get('file_name') or os.path.basename(image['image_url'].split('?', 1)[0])
                  if not os.path.splitext(image_name)[1]:
                      image_name += '.jpg'
                  process_image(image['image_url'], image_name, staging_dir)
                  image_markdown = f"![{image.get('alt', '')}]({{{{ site.pics_url }}}}{image_name})"
                  body_parts.append(image_markdown)

          if clean_payload['youtube_id']:
              body_parts.append(f'{{% include youtubePlayer.html id="{clean_payload["youtube_id"]}" %}}')

          if clean_payload['bottom_text']:
              body_parts.append(clean_payload['bottom_text'])

          body = '\n\n'.join(part for part in body_parts if part)

          if os.path.exists(file_path):
              with open(file_path, 'a', encoding='utf-8') as handle:
                  if body:
                      handle.write('\n\n')
                      handle.write(body)
                      handle.write('\n')
          else:
              front_matter_lines = ['---', f'title: "{clean_payload["title"]}"', f'author: {clean_payload["author"]}']
              if clean_payload['categories']:
                  front_matter_lines.append(f'categories: {format_yaml_list(clean_payload["categories"])}')
              if clean_payload['tags']:
                  front_matter_lines.append(f'tags: {format_yaml_list(clean_payload["tags"])}')
              if clean_payload['youtube_id']:
                  front_matter_lines.append(f'youtubeId: {clean_payload["youtube_id"]}')
              front_matter_lines.append('---')
              front_matter_text = '\n'.join(front_matter_lines) + '\n\n'
              if body:
                  front_matter_text += body + '\n'
              with open(file_path, 'w', encoding='utf-8') as handle:
                  handle.write(front_matter_text)

          if clean_payload['quote'] or clean_payload['quote_attribution']:
              with open(file_path, 'a', encoding='utf-8') as handle:
                  handle.write('\n')
                  if clean_payload['quote']:
                      handle.write(format_blockquote(clean_payload['quote']))
                      handle.write('\n\n')
                  if clean_payload['quote_attribution']:
                      handle.write('\n')
                      handle.write(f'- {clean_payload["quote_attribution"]}\n')
          PY

      - name: Upload to Turbify via FTP (upload only)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          STAGING_DIR="${{ runner.temp }}/blog-image-uploads"
          if [[ ! -d "$STAGING_DIR" ]] || [[ -z "$(find "$STAGING_DIR" -type f -print -quit)" ]]; then
              echo "No staged image files found; skipping FTP upload."
              exit 0
          fi

          BASE_URL="$FTP_SERVER"
          if [[ "$BASE_URL" != ftp://* && "$BASE_URL" != ftps://* ]]; then
              BASE_URL="ftp://$BASE_URL"
          fi
          BASE_URL="${BASE_URL%/}"

          while IFS= read -r -d '' file; do
              rel_path="${file#"$STAGING_DIR"/}"
              remote_path="pics/blog/$rel_path"
              echo "Uploading $rel_path"
              curl --fail --silent --show-error --ftp-create-dirs \
                  --user "$FTP_USERNAME:$FTP_PASSWORD" \
                  -T "$file" \
                  "$BASE_URL/$remote_path"
          done < <(find "$STAGING_DIR" -type f -print0)

      - name: Remove staged image files
        if: always()
        run: rm -rf "${{ runner.temp }}/blog-image-uploads"

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated blog update from phone"
          file_pattern: 'all_collections/_posts/*'
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }}

          
