name: Process Blog Post
on:
  repository_dispatch:
    types: [new-post]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Process & Update
        run: |
          # Define path
          FILE_PATH="all_collections/_posts/${{ github.event.client_payload.filename }}"
          
          # Prepare content
          NEW_CONTENT=$(cat <<EOF
          
          ${{ github.event.client_payload.text_before }}
          
          ![${{ github.event.client_payload.alt }}](${{ github.event.client_payload.image_url }})
          
          ${{ github.event.client_payload.text_after }}
          
          > ${{ github.event.client_payload.quote }}
          EOF
          )

          # Logic: If file exists, append; otherwise, create new
          if [ -f "$FILE_PATH" ]; then
            echo "$NEW_CONTENT" >> "$FILE_PATH"
          else
            echo "---" > "$FILE_PATH"
            echo "title: '${{ github.event.client_payload.title }}'" >> "$FILE_PATH"
            echo "author: '${{ github.event.client_payload.author }}'" >> "$FILE_PATH"
            echo "---" >> "$FILE_PATH"
            echo "$NEW_CONTENT" >> "$FILE_PATH"
          fi

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated blog update from phone"
          # This tells the action to use your secret for authentication
          file_pattern: 'all_collections/_posts/*' 
        env:
          # This connects the secret we added to the action
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
          
