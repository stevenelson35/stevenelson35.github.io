---
title: Travelin' On Photos
---
<style>
  #browse-app { max-width: 900px; margin: 0 auto; color: #e8e8e8; }
  #browse-viewer { position: relative; text-align: center; background: transparent; padding: 0; }
  #browse-viewer img {
    display: block; width: auto; height: auto; min-width: 0; max-width: 100%; max-height: 70vh;
    object-fit: contain; border: 0; outline: 0; box-shadow: none; margin: 0 auto;
  }
  #browse-caption { margin: 0.5rem 0; color: #b6b6b6; font-size: 0.9rem; }
  #browse-position { color: #666; font-size: 0.85rem; }
  .browse-nav { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin: 0.75rem 0; }
  .browse-nav button {
    background: #252525; color: #f0e7d5; border: 1px solid #434343; border-radius: 4px;
    padding: 0.4rem 0.8rem; cursor: pointer; font-size: 0.9rem;
  }
  .browse-nav button:hover { border-color: #ffcc00; }
  #browse-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin: 0.75rem 0; }
  .browse-chip {
    background: #252525; color: #b6b6b6; border: 1px solid #434343; border-radius: 999px;
    padding: 0.3rem 0.8rem; cursor: pointer; font-size: 0.85rem;
  }
  .browse-chip.on { background: #659e10; color: white; border-color: #527f0e; }
  #browse-add-person {
    background: #252525; color: #e8e8e8; border: 1px solid #434343; border-radius: 999px; padding: 0.3rem 0.6rem;
  }
  #browse-timeline { margin: 1rem 0; }
  #browse-timeline-track {
    position: relative; height: 28px; background: #121212; border: 1px solid #434343; border-radius: 4px;
  }
  .browse-tick {
    position: absolute; top: 4px; width: 2px; height: 20px; background: #696969; cursor: pointer;
  }
  .browse-tick.current { background: #ffcc00; width: 3px; }
  .browse-event-band { position: absolute; top: 0; height: 28px; background: rgba(255, 204, 0, 0.12); }
  #browse-events { list-style: none; padding: 0; margin: 0.5rem 0 0; text-align: center; font-size: 0.9rem; }
  #browse-events a { color: #ffcc00; }
  .browse-muted { color: #666; }
  #browse-gate { max-width: 360px; margin: 3rem auto; text-align: center; color: #e8e8e8; }
  #browse-gate input {
    background: #252525; color: #e8e8e8; border: 1px solid #434343; border-radius: 4px;
    padding: 0.4rem 0.6rem; font-size: 1rem; width: 100%; box-sizing: border-box; margin: 0.5rem 0;
  }
  #browse-gate button {
    background: #252525; color: #f0e7d5; border: 1px solid #434343; border-radius: 4px;
    padding: 0.4rem 1.2rem; cursor: pointer; font-size: 0.95rem;
  }
  #browse-gate button:hover { border-color: #ffcc00; }
  #browse-gate-error { color: #ff8080; }
</style>

<div id="browse-gate">
  <p>This page isn't public. Enter the passphrase to continue.</p>
  <input type="password" id="browse-gate-input" autocomplete="off">
  <div><button id="browse-gate-submit">Enter</button></div>
  <p id="browse-gate-error" style="display:none;">Wrong passphrase.</p>
</div>

<div id="browse-app" style="display:none;">
  <p>Browse favorites by who's in them and when they were taken. Toggle people below, or drag the
  timeline; ← and → move to the next matching photo in time.</p>

  <div id="browse-viewer">
    <img id="browse-image" alt="">
  </div>
  <p id="browse-caption"></p>

  <div class="browse-nav">
    <button id="browse-first" title="Furthest back with this filter">⏮ Furthest back</button>
    <button id="browse-prev" title="Previous match">‹ Prev</button>
    <span id="browse-position">0 / 0</span>
    <button id="browse-next" title="Next match">Next ›</button>
    <button id="browse-last" title="Most recent with this filter">Most recent ⏭</button>
  </div>
  <div class="browse-nav">
    <button id="browse-group-back" title="Same exact group, back in time">⏪ Same group</button>
    <button id="browse-group-furthest" title="Same exact group, furthest back">Same group, furthest back</button>
    <button id="browse-group-next" title="Same exact group, forward in time">Same group ⏩</button>
  </div>

  <div id="browse-chips"></div>
  <div style="text-align:center;">
    <select id="browse-add-person"><option value="">+ add person…</option></select>
  </div>

  <div id="browse-timeline">
    <div id="browse-timeline-track"></div>
  </div>

  <h3 style="text-align:center;">Events</h3>
  <ul id="browse-events"></ul>
</div>

<script>window.BROWSE_PICS_URL = "{{ site.browse_pics_url }}";</script>
<script>
/* A light deterrent, not real security: this is a static site, so there's no server-side login
 * available. The passphrase is never sent anywhere; it's just hashed and compared in-browser.
 * Set your own passphrase with: printf '%s' 'your passphrase' | sha256sum
 */
(function () {
  var PASSPHRASE_SHA256 = "742875640f787c77813648aa6c430306c129c2bfa802786ce47c2145fdf24cc1";
  var STORAGE_KEY = "browse-unlocked-v1";

  function sha256Hex(text) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function unlock() {
    document.getElementById("browse-gate").style.display = "none";
    document.getElementById("browse-app").style.display = "";
    var s = document.createElement("script");
    s.src = "{{ '/assets/js/browse.js' | relative_url }}";
    s.defer = true;
    document.body.appendChild(s);
  }

  if (localStorage.getItem(STORAGE_KEY) === "1") { unlock(); return; }

  function tryUnlock() {
    sha256Hex(document.getElementById("browse-gate-input").value).then(function (hex) {
      if (hex === PASSPHRASE_SHA256) {
        localStorage.setItem(STORAGE_KEY, "1");
        unlock();
      } else {
        document.getElementById("browse-gate-error").style.display = "";
      }
    });
  }

  document.getElementById("browse-gate-submit").addEventListener("click", tryUnlock);
  document.getElementById("browse-gate-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryUnlock();
  });
})();
</script>
